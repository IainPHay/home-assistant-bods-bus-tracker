# BODS Bus Tracker generic departure-board card
# Replace BOTH occurrences of sensor.YOUR_NEXT_BUS_ENTITY with the stop's
# native "Next bus" entity ID from Home Assistant.
type: markdown
entity_id:
  - sensor.YOUR_NEXT_BUS_ENTITY
content: |
  {% set entity = 'sensor.YOUR_NEXT_BUS_ENTITY' %}
  {% set departures = state_attr(entity, 'departures') or [] %}
  {% set stop = state_attr(entity, 'stop') or {} %}
  {% set updated = state_attr(entity, 'tracker_updated') %}
  {% set health = state_attr(entity, 'data_status') %}

  ## 🚌 {{ stop.get('name', 'Bus departures') }}

  {% if departures | count > 0 %}
  {% set next = departures[0] %}
  {% set next_minutes = next.get('minutes', 999) | int(999) %}
  {% set next_expected = next.get('expected') %}
  {% set next_source = next.get('source', 'scheduled') %}
  {% set next_raw = next.get('raw_delay_minutes') %}
  {% if next_raw is none %}
    {% set next_raw = next.get('delay_minutes') %}
  {% endif %}
  {% set next_timing = next.get('timing_status') %}

  ### {{ next.get('route', '?') }} · {% if next_minutes <= 0 %}Due now{% elif next_minutes == 1 %}1 min{% else %}{{ next_minutes }} min{% endif %}

  {% if next_source == 'live' %}🟢 **Live**{% else %}🕒 **Timetable**{% endif %}{% if next.get('destination') %} → {{ next.get('destination') }}{% endif %}{% if next_expected %} · **{{ as_timestamp(next_expected) | timestamp_custom('%H:%M', true) }}**{% endif %}{% if next_source == 'live' and next_timing == 'late' and next_raw is not none %} · <font color="#d32f2f">**{{ '%.1f' | format(next_raw | float | abs) }} min late**</font>{% elif next_source == 'live' and next_timing == 'early' and next_raw is not none %} · {{ '%.1f' | format(next_raw | float | abs) }} min early{% if next.get('prediction_clamped', false) %} · held to timetable{% endif %}{% elif next_source == 'live' and next_timing == 'on_time' %} · On time{% endif %}

  {% if next_source == 'live' and next.get('vehicle') %}
  Vehicle {{ next.get('vehicle') }}
  {% endif %}

  ---

  | Service | Due |
  | :--- | :--- |
  {% for row in departures[:5] -%}
  {% set mins = row.get('minutes', 999) | int(999) -%}
  {% set expected = row.get('expected') -%}
  {% set source = row.get('source', 'scheduled') -%}
  {% set raw = row.get('raw_delay_minutes') -%}
  {% if raw is none -%}{% set raw = row.get('delay_minutes') -%}{% endif -%}
  {% set timing = row.get('timing_status') -%}
  | **{{ row.get('route', '?') }}** {% if source == 'live' %}🟢{% else %}🕒{% endif %} | **{% if mins <= 0 %}Due now{% elif mins == 1 %}1 min{% else %}{{ mins }} min{% endif %}**{% if expected %} · {{ as_timestamp(expected) | timestamp_custom('%H:%M', true) }}{% endif %}{% if source == 'live' and timing == 'late' and raw is not none %} · <font color="#d32f2f">**{{ '%.1f' | format(raw | float | abs) }}m late**</font>{% elif source == 'live' and timing == 'early' and raw is not none %} · {{ '%.1f' | format(raw | float | abs) }}m early{% if row.get('prediction_clamped', false) %} · held{% endif %}{% elif source == 'live' and timing == 'on_time' %} · On time{% endif %} |
  {% endfor %}

  {% if departures | count > 5 %}
  *+{{ departures | count - 5 }} later departure{% if departures | count - 5 != 1 %}s{% endif %}*
  {% endif %}

  {% else %}
  ### No upcoming buses
  No matching departures are currently available.
  {% endif %}

  ---

  {% set live_count = departures | selectattr('source', 'equalto', 'live') | list | count %}
  {% if health == 'ok' %}✅ **Tracker updating**{% elif health == 'degraded' %}⚠️ **Live data degraded**{% elif health == 'scheduled_only' %}🕒 **Timetable data only**{% else %}❔ **Tracker status unknown**{% endif %} · {% if live_count == 1 %}1 live-tracked{% else %}{{ live_count }} live-tracked{% endif %}{% if updated %} · Updated {{ relative_time(as_datetime(updated)) }} ago{% endif %}
