name: Bug report
description: Report a problem with BODS Bus Tracker
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Do not include your BODS API key, routing-provider credentials, or unredacted precise personal-location data.** For structured v0.6 field testing, see TESTING.md first.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.x
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: BODS Bus Tracker version
      placeholder: 0.6.0
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: BODS region
      placeholder: North East
    validations:
      required: true
  - type: input
    id: stop
    attributes:
      label: Stop ATCO code
      placeholder: 3100Z199842
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: Route/operator and selected services
      placeholder: Arriva North East / X14, X15, X16, X18
  - type: dropdown
    id: stop_view
    attributes:
      label: Stop view
      options:
        - Departures
        - Arrivals
        - Arrivals and departures
        - Not sure
  - type: dropdown
    id: routed_walking
    attributes:
      label: Routed dynamic walking enabled?
      options:
        - "No"
        - "Yes"
  - type: input
    id: routing_provider
    attributes:
      label: Routing provider / duration sensor type
      description: Optional. Do not include API keys or precise person/device coordinates.
      placeholder: HERE Travel Time / other duration sensor
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the approximate date/time and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or diagnostics
      description: Remove credentials and personal-location data before posting. Home Assistant integration diagnostics are preferred where available.
      render: text
