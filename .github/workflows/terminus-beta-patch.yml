name: Apply terminus beta config patch

on:
  push:
    branches:
      - feature/terminus-arrivals
    paths:
      - .github/workflows/terminus-beta-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/terminus-arrivals
          fetch-depth: 0
      - name: Patch config flow and manifest
        shell: python
        run: |
          from pathlib import Path
          import json

          path = Path('custom_components/bods_bus_tracker/config_flow.py')
          text = path.read_text()

          def replace_once(old, new):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one match, found {text.count(old)} for: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '    CONF_STOP_SEARCH,\n    CONF_STOP_SELECTION,\n    CONF_WALKING_TIME,\n    DEFAULT_POLL_INTERVAL,\n    DEFAULT_WALKING_TIME,',
              '    CONF_STOP_SEARCH,\n    CONF_STOP_SELECTION,\n    CONF_STOP_VIEW,\n    CONF_WALKING_TIME,\n    DEFAULT_POLL_INTERVAL,\n    DEFAULT_STOP_VIEW,\n    DEFAULT_WALKING_TIME,\n    STOP_VIEW_ARRIVALS,\n    STOP_VIEW_BOTH,\n    STOP_VIEW_DEPARTURES,'
          )

          replace_once(
              'def _stop_search_schema(default_region: str = AUTO_REGION) -> vol.Schema:',
              '''def _stop_view_options() -> list[SelectOptionDict]:\n    return [\n        SelectOptionDict(value=STOP_VIEW_DEPARTURES, label="Departures"),\n        SelectOptionDict(value=STOP_VIEW_ARRIVALS, label="Arrivals"),\n        SelectOptionDict(value=STOP_VIEW_BOTH, label="Arrivals and departures"),\n    ]\n\n\ndef _stop_search_schema(default_region: str = AUTO_REGION) -> vol.Schema:'''
          )

          replace_once(
              '                    self._data[CONF_WALKING_TIME] = int(\n                        user_input.get(CONF_WALKING_TIME, DEFAULT_WALKING_TIME)\n                    )',
              '                    self._data[CONF_STOP_VIEW] = str(\n                        user_input.get(CONF_STOP_VIEW, DEFAULT_STOP_VIEW)\n                    )\n                    self._data[CONF_WALKING_TIME] = int(\n                        user_input.get(CONF_WALKING_TIME, DEFAULT_WALKING_TIME)\n                    )'
          )

          services_marker = '''                    vol.Optional(\n                        CONF_WALKING_TIME, default=DEFAULT_WALKING_TIME\n                    ): selector.NumberSelector('''
          services_insert = '''                    vol.Optional(\n                        CONF_STOP_VIEW, default=DEFAULT_STOP_VIEW\n                    ): selector.SelectSelector(\n                        selector.SelectSelectorConfig(\n                            options=_stop_view_options(),\n                            mode=selector.SelectSelectorMode.DROPDOWN,\n                        )\n                    ),\n                    vol.Optional(\n                        CONF_WALKING_TIME, default=DEFAULT_WALKING_TIME\n                    ): selector.NumberSelector('''
          replace_once(services_marker, services_insert)

          replace_once(
              '                            CONF_SERVICES: selected,\n                            CONF_WALKING_TIME: int(user_input[CONF_WALKING_TIME]),',
              '                            CONF_SERVICES: selected,\n                            CONF_STOP_VIEW: str(user_input[CONF_STOP_VIEW]),\n                            CONF_WALKING_TIME: int(user_input[CONF_WALKING_TIME]),'
          )

          reconfigure_marker = '''                    vol.Required(\n                        CONF_WALKING_TIME,\n                        default=int('''
          reconfigure_insert = '''                    vol.Required(\n                        CONF_STOP_VIEW,\n                        default=str(\n                            subentry.data.get(CONF_STOP_VIEW, DEFAULT_STOP_VIEW)\n                        ),\n                    ): selector.SelectSelector(\n                        selector.SelectSelectorConfig(\n                            options=_stop_view_options(),\n                            mode=selector.SelectSelectorMode.DROPDOWN,\n                        )\n                    ),\n                    vol.Required(\n                        CONF_WALKING_TIME,\n                        default=int('''
          replace_once(reconfigure_marker, reconfigure_insert)

          text = text.replace(
              '"""Change services, walking time and poll interval for one stop."""',
              '"""Change services, stop view, walking time and poll interval for one stop."""',
              1,
          )
          path.write_text(text)

          manifest_path = Path('custom_components/bods_bus_tracker/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['version'] = '0.5.0-beta.1'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          Path('.github/workflows/terminus-beta-patch.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/bods_bus_tracker/config_flow.py custom_components/bods_bus_tracker/manifest.json .github/workflows/terminus-beta-patch.yml
          git commit -m "Add arrivals/departures stop view configuration [skip ci]"
          git push origin HEAD:feature/terminus-arrivals
