name: Publish v0.4.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.4.1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v0.4.1.yml
          git commit -m "Remove one-off v0.4.1 release workflow [skip ci]"
          git push origin HEAD:main
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.4.1 \
            --target main \
            --title "BODS Bus Tracker v0.4.1 — release metadata and screenshot fix" \
            --notes-file - <<'EOF'
          # BODS Bus Tracker v0.4.1

          Patch release for the v0.4 walking-time release.

          ## Fixes

          - Fixed the Home Assistant stop-device software/firmware version so it now reports **0.4.1** instead of the stale `0.4.0-beta.1` value.
          - Added a dedicated CI check that requires the runtime version constant and `manifest.json` version to match on every validation run.
          - Replaced the blank/incorrect README departure-card image with the approved working walking-guidance card image.
          - Updated the README version badge/link and changelog for 0.4.1.

          ## Behaviour

          There are **no ETA, live-to-GTFS matching, walking-time, configuration, or multi-stop behaviour changes** from v0.4.0.

          ## Validation

          - HACS: passed
          - Hassfest: passed
          - Runtime/manifest version sync: passed

          ## Upgrade

          Update through HACS and restart Home Assistant. Existing BODS account, stop subentries, entity IDs, history and walking-time settings are retained.
          EOF
