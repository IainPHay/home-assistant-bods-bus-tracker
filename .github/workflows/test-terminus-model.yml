name: Test terminus model

on:
  push:
    branches:
      - feature/terminus-arrivals
    paths:
      - .github/workflows/test-terminus-model.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/terminus-arrivals
          fetch-depth: 0
      - name: Build isolated model package
        run: |
          mkdir -p /tmp/model/custom_components/bods_bus_tracker /tmp/model/tests
          touch /tmp/model/custom_components/__init__.py
          touch /tmp/model/custom_components/bods_bus_tracker/__init__.py
          cp custom_components/bods_bus_tracker/api.py /tmp/model/custom_components/bods_bus_tracker/
          cp custom_components/bods_bus_tracker/const.py /tmp/model/custom_components/bods_bus_tracker/
          cp custom_components/bods_bus_tracker/stop_view.py /tmp/model/custom_components/bods_bus_tracker/
          cp tests/test_stop_view.py /tmp/model/tests/
      - name: Run stop-view tests
        run: |
          python -m pip install --quiet pytest
          cd /tmp/model
          pytest -q tests/test_stop_view.py
      - name: Remove one-off test workflow
        run: |
          rm .github/workflows/test-terminus-model.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/test-terminus-model.yml
          git commit -m "Remove one-off terminus model test workflow [skip ci]"
          git push origin HEAD:feature/terminus-arrivals
