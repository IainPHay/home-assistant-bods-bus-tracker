name: Publish v0.4.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.4.2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove one-off workflow
        shell: bash
        run: |
          git rm .github/workflows/publish-v0.4.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-off v0.4.2 release workflow [skip ci]"
          git push origin HEAD:main
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.4.2 \
            --target main \
            --title "BODS Bus Tracker v0.4.2 — asset and branding fixes" \
            --notes-file - <<'EOF'
          # BODS Bus Tracker v0.4.2

          Patch release repairing the binary documentation and branding assets distributed with v0.4.1.

          ## Fixes

          - Replaced the corrupted/truncated blue bus icon with a complete 256×256 transparent icon with safe padding so the full bus body and wheels remain visible across Home Assistant views, including Repairs.
          - Replaced the integration's packaged icon copy with the same byte-identical asset.
          - Replaced the broken README departure-card image with the approved real walking-guidance screenshot.
          - Restored the README to the repaired `departure-card.png` on `main` and removed the malformed duplicate JPEG.
          - Bumped both the integration manifest and runtime version to **0.4.2**.

          ## Behaviour

          There are **no ETA, GTFS matching, walking-time, configuration, entity, coordinator or multi-stop behaviour changes** from v0.4.1.

          ## Validation

          - HACS: passed
          - Hassfest: passed
          - Runtime/manifest version sync: passed
          - Replacement binary Git blob hashes matched the locally calculated hashes after upload

          ## Upgrade

          Update through HACS and restart Home Assistant. Existing BODS account configuration, stop subentries, walking-time settings, entity IDs and history are retained.
          EOF
