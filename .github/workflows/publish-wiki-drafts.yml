name: Publish wiki drafts

on:
  push:
    branches:
      - wiki-drafts
    paths:
      - "wiki-drafts/**"
      - ".github/workflows/publish-wiki-drafts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out wiki source
        uses: actions/checkout@v4

      - name: Clone GitHub wiki
        run: git clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/bods-wiki

      - name: Copy wiki pages
        run: cp -a wiki-drafts/. /tmp/bods-wiki/

      - name: Commit and publish wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/bods-wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "Sync BODS Bus Tracker wiki"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          git push origin HEAD
