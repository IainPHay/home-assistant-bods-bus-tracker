name: Prepare v0.4.2 asset review

on:
  push:
    branches:
      - fix/v0.4.2-assets
    paths:
      - .github/workflows/prepare-v0.4.2-assets.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.4.2-assets
      - name: Point README at repaired branch image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace(
              'https://raw.githubusercontent.com/IainPHay/home-assistant-bods-bus-tracker/main/docs/images/departure-card.jpg',
              'https://raw.githubusercontent.com/IainPHay/home-assistant-bods-bus-tracker/fix/v0.4.2-assets/docs/images/departure-card.png',
          )
          p.write_text(s)
          PY
      - name: Remove one-off workflow
        run: rm .github/workflows/prepare-v0.4.2-assets.yml
      - name: Commit branch README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/prepare-v0.4.2-assets.yml
          git commit -m 'Point README at repaired card image [skip ci]'
          git push origin HEAD:fix/v0.4.2-assets
