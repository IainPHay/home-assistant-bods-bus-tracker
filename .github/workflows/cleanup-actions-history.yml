name: Cleanup Actions history

on:
  push:
    branches:
      - feature/v0.7
    paths:
      - ".github/workflows/cleanup-actions-history.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate             "/repos/${REPOSITORY}/actions/runs?per_page=100"             --jq '.workflow_runs[] | [
              .id,
              .name,
              .path,
              .event,
              .status,
              (.conclusion // ""),
              (.head_branch // ""),
              .created_at
            ] | @tsv' > /tmp/runs.tsv

          python - <<'PY' > /tmp/delete.tsv
          from __future__ import annotations

          import datetime as dt
          import os
          from pathlib import Path

          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          cutoff = dt.datetime.now(dt.UTC) - dt.timedelta(days=3)

          rows = []
          for raw in Path("/tmp/runs.tsv").read_text(encoding="utf-8").splitlines():
              if not raw.strip():
                  continue
              parts = raw.split("\t")
              if len(parts) != 8:
                  continue
              run_id, name, path, event, status, conclusion, head_branch, created_at = parts
              created = dt.datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              rows.append(
                  {
                      "id": int(run_id),
                      "name": name,
                      "path": path,
                      "event": event,
                      "status": status,
                      "conclusion": conclusion,
                      "head_branch": head_branch,
                      "created": created,
                  }
              )

          # Always retain at least the newest successful validation on main and the
          # current v0.7 pull request, even if the age rule changes in future.
          keep_ids: set[int] = {current_run_id}
          for branch, event in (("main", "push"), ("feature/v0.7", "pull_request")):
              for row in rows:
                  if (
                      row["path"] == ".github/workflows/validate.yml"
                      and row["head_branch"] == branch
                      and row["event"] == event
                      and row["status"] == "completed"
                      and row["conclusion"] == "success"
                  ):
                      keep_ids.add(row["id"])
                      break

          for row in rows:
              run_id = row["id"]

              if run_id in keep_ids:
                  continue

              # Never touch active/queued runs.
              if row["status"] != "completed":
                  continue

              # Preserve tag/release validation history.
              branch = row["head_branch"]
              if branch.startswith("v") and len(branch) > 1 and branch[1].isdigit():
                  continue

              # Remove completed one-shot/helper workflows. The only normal workflow
              # that should remain in the repository is validate.yml.
              if row["path"] != ".github/workflows/validate.yml":
                  print(
                      f'{run_id}\tobsolete-workflow\t{row["name"]}\t'
                      f'{row["path"]}\t{row["created"].isoformat()}'
                  )
                  continue

              # Keep recent validation evidence; remove older routine CI noise.
              if row["created"] < cutoff:
                  print(
                      f'{run_id}\told-validation\t{row["name"]}\t'
                      f'{row["event"]}\t{row["created"].isoformat()}'
                  )
          PY

          total="$(wc -l < /tmp/runs.tsv | tr -d ' ')"
          delete_count="$(wc -l < /tmp/delete.tsv | tr -d ' ')"
          echo "Found ${total} workflow runs; deleting ${delete_count} safe historical runs."

          if [[ "${delete_count}" == "0" ]]; then
            exit 0
          fi

          deleted=0
          while IFS=$'\t' read -r run_id reason name detail created; do
            echo "Deleting run ${run_id}: ${reason} | ${name} | ${detail} | ${created}"
            gh api --method DELETE "/repos/${REPOSITORY}/actions/runs/${run_id}"
            deleted=$((deleted + 1))
          done < /tmp/delete.tsv

          echo "Deleted ${deleted} workflow runs."
