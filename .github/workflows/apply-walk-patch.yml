name: Apply walking-time feature patch

on:
  push:
    branches:
      - feature/walk-to-stop
    paths:
      - .github/walk_patch.py
      - .github/workflows/apply-walk-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/walk-to-stop
      - name: Apply feature patch
        run: python .github/walk_patch.py
      - name: Commit feature implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add walking-time leave guidance"
          git push origin feature/walk-to-stop
