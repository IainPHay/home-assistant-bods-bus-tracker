name: Validate

on:
  # Feature branches are validated through their pull requests, avoiding a
  # duplicate push + pull_request run for every development commit.
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

# Only the newest validation for the same PR/ref is useful. Cancelling superseded
# runs keeps Actions history readable and frees runners for the current commit.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest and runtime versions match
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          root = Path('custom_components/bods_bus_tracker')
          manifest_version = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))['version']
          tree = ast.parse((root / 'const.py').read_text(encoding='utf-8'))
          runtime_version = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'VERSION':
                          runtime_version = ast.literal_eval(node.value)
          if runtime_version != manifest_version:
              raise SystemExit(
                  f'Version mismatch: manifest={manifest_version!r}, runtime={runtime_version!r}'
              )
          print(f'Version sync OK: {manifest_version}')
          PY


  validate-cache-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run GTFS cache invalidation regression tests
        run: python -m unittest discover -s tests -p 'test_gtfs_cache_policy.py' -v


  validate-ha-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install Home Assistant test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run Home Assistant-native tests with coverage
        run: >
          pytest -q
          --cov=custom_components.bods_bus_tracker
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=json:coverage.json
          --cov-fail-under=100

      - name: Enforce Integration Quality Scale coverage gates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("coverage.json").read_text(encoding="utf-8"))
          prefix = "custom_components/bods_bus_tracker/"
          modules = {
              path: data["summary"]
              for path, data in report["files"].items()
              if path.startswith(prefix) and path.endswith(".py")
          }

          config_flow = modules[f"{prefix}config_flow.py"]
          if config_flow["missing_lines"] != 0:
              raise SystemExit(
                  "Quality Scale failure: config_flow.py must have 100% line coverage "
                  f"(missing {config_flow['missing_lines']} lines)"
              )

          incomplete = []
          for path, summary in sorted(modules.items()):
              if summary["missing_lines"] != 0:
                  incomplete.append(
                      f"{path}: missing {summary['missing_lines']} lines"
                  )

          if incomplete:
              raise SystemExit(
                  "Coverage failure: every integration module must remain at 100% "
                  "line coverage:\n" + "\n".join(incomplete)
              )

          total = report["totals"]["percent_covered"]
          print("Config flow coverage: 100.00%")
          print("Every integration module: 100.00%")
          print(f"Overall integration coverage: {total:.2f}%")
          PY


  validate-strict-typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install Home Assistant typing dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run strict mypy validation
        run: mypy --config-file mypy.ini custom_components/bods_bus_tracker
