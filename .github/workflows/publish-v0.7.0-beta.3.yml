name: Publish v0.7.0 beta.3

on:
  push:
    branches:
      - feature/v0.7
    paths:
      - ".github/workflows/publish-v0.7.0-beta.3.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.7.0-beta.3 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "v0.7.0-beta.3 already exists."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          v0.7.0-beta.3 is a focused diagnostics/privacy hardening prerelease following real Home Assistant beta.2 testing.

          ### Diagnostics/privacy fix
          - Fixes a beta.2 edge case where the private full departure scratch list `_departures_for_guidance` could remain in coordinator state when walking guidance was disabled and then appear in Home Assistant diagnostics.
          - Catchable processing now removes the private full departure sequence before every return path, including `walking_disabled`.
          - Diagnostics also independently strip `_departures_for_guidance` as a defence-in-depth safeguard.
          - Added regression coverage for walking-disabled cleanup and diagnostics removal of private guidance state and coordinates.
          - The beta.2 capture did not expose `person` / `device_tracker` coordinates or routing-provider credentials; the leaked rows were internal departure candidates and could include trip IDs.
          - Catchable summaries remain restricted to the intended automation-safe fields and continue to exclude live vehicle coordinates and trip IDs.

          ### Real beta.2 validation retained
          - Catchable departure selected when reachable.
          - Explicit safety margin correctly rejected a near departure.
          - Walking-disabled and Arrivals-only views correctly made Catchable bus unavailable.
          - Invalid routed-walking input correctly fell back to the configured static walking time.
          - Catchability correctly consumed that static fallback.

          ### CI
          - HACS: passed
          - Hassfest: passed
          - version sync: passed
          - GTFS cache policy: passed
          - strict mypy: passed
          - 162 Home Assistant-native tests: passed
          - coverage: 95.45%
          - feature-branch CI now avoids duplicate push + pull-request validation runs.

          This is a prerelease for targeted v0.7 testing. Stable v0.6.0 remains the recommended release for normal users.
          EOF

          gh release create v0.7.0-beta.3             --repo "${GITHUB_REPOSITORY}"             --target "4c2f4c79d3f4afa926214380db2f40f735e88142"             --prerelease             --title "BODS Bus Tracker v0.7.0-beta.3 — diagnostics/privacy hardening"             --notes-file /tmp/release-notes.md
